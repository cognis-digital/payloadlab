apiVersion: apps/v1
kind: Deployment
metadata: { name: payloadlab, labels: { app: payloadlab } }
spec:
  replicas: 1
  selector: { matchLabels: { app: payloadlab } }
  template:
    metadata: { labels: { app: payloadlab } }
    spec:
      containers:
        - name: payloadlab
          image: ghcr.io/cognis-digital/payloadlab:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: payloadlab }
spec:
  selector: { app: payloadlab }
  ports: [{ port: 80, targetPort: 8000 }]
